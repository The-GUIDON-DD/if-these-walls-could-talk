name: Notify when there are changes in main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send TG Reminder
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TG_TO }}
          message: |
            *[CHANGES TO MAIN BRANCH]*

            Commit Message: ${{ github.event.head_commit.message }}
            View Changes: ${{ github.event.head_commit.url }}

            The main branch has been updated. Please pull/merge from the latest version of main.
