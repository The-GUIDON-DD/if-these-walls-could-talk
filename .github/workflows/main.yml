name: Notify when there are changes in main

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send TG Reminder
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_TO }}
          token: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TG_DEBUG_CHAT }}
          message: |
            **[CHANGES TO MAIN BRANCH]**

            Title: ${{ github.event.pull_request.title }}
            Author: ${{ github.event.pull_request.user }}

            The main branch has been updated. Please pull/merge from the latest version of main.
