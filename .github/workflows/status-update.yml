name: Notify when there are changes in main

on:
  schedule:
    - cron: '0 14 * * 1,3,5'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send TG Reminder
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_NOTIFY_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TG_DEBUG_THREAD }}
          format: markdown
          message: |
            *[STATUS UPDATE]*

            Hello @julyannahuang. Please update me with the following format by *5PM today*:
            1. Progress
            2. Blockers
            3. PR or Screenshots/Video for any progress you have
